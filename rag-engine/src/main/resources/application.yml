server:
  port: 8089

spring:
  application:
    name: enterprise-rag-engine

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.7
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
        embeddings-path: /embeddings
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${RAG_EMBEDDING_DIMENSION:1536}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      database: ${MILVUS_DATABASE:default}

rag:
  collection:
    name: ${RAG_COLLECTION_NAME:enterprise_knowledge}
  document:
    chunk-size: 1000
    chunk-overlap: 200
  retrieval:
    top-k: 5
    score-threshold: 0.5
  embedding:
    dimension: ${RAG_EMBEDDING_DIMENSION:1536}

logging:
  level:
    root: INFO
    com.enterprise.rag: DEBUG
