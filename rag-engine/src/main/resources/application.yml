server:
  port: 8089

spring:
  application:
    name: enterprise-rag-engine

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:deepseek-v4-flash}
          # RAG 生成需强约束于检索内容，低温度可降低幻觉、提升 faithfulness
          temperature: ${RAG_CHAT_TEMPERATURE:0.2}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
        embeddings-path: /embeddings
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${RAG_EMBEDDING_DIMENSION:1536}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      database: ${MILVUS_DATABASE:default}

rag:
  collection:
    name: ${RAG_COLLECTION_NAME:enterprise_knowledge}
  document:
    chunk-size: 1000
    chunk-overlap: 200
  retrieval:
    top-k: 5
    # DashScope text-embedding-v4 相似度整体偏低（相关片段常落在 0.3~0.5），0.5 会误滤掉有效召回
    score-threshold: 0.3
  embedding:
    dimension: ${RAG_EMBEDDING_DIMENSION:1536}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
  chat:
    memory:
      # Spring AI 会话记忆窗口大小（消息条数），超出后丢弃最旧消息
      max-messages: ${RAG_CHAT_MEMORY_MAX_MESSAGES:20}

logging:
  level:
    root: INFO
    com.enterprise.rag: DEBUG
