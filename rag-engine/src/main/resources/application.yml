server:
  port: 8080

spring:
  application:
    name: enterprise-rag-engine
  
  # OpenAI 配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      embedding:
        options:
          model: text-embedding-ada-002
      chat:
        options:
          model: gpt-4-turbo
          temperature: 0.7
    
    # Milvus 配置
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      database: ${MILVUS_DATABASE:default}
      collection-name: enterprise_knowledge

# RAG 配置
rag:
  document:
    chunk-size: 1000
    chunk-overlap: 200
  
  retrieval:
    top-k: 5
    score-threshold: 0.7

logging:
  level:
    root: INFO
    com.enterprise.rag: DEBUG